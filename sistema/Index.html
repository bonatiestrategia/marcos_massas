<title>Controle de Marmitas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app de cozinha. Cabeçalho fixo com abas (no celular, abas embaixo),
   conteúdo em coluna única de até 1040px, edição sempre em janela sobreposta. */
:root {
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --surface-2: #E8EEE7;
  --ink: #16211A;
  --muted: #5A685F;
  --line: #D3DCD2;
  --accent: #2B6A4C;
  --accent-ink: #FFFFFF;
  --accent-soft: #DAEADF;
  --ok: #26724A; --ok-soft: #DCEFE2;
  --warn: #8A5D00; --warn-soft: #F6EACB;
  --bad: #A8352B; --bad-soft: #F5DDDA;
  --shadow: 0 1px 2px rgba(22, 33, 26, .06), 0 4px 16px rgba(22, 33, 26, .06);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1511; --surface: #172019; --surface-2: #202B23; --ink: #E4ECE6; --muted: #98A89E;
    --line: #2C3A30; --accent: #6FC293; --accent-ink: #0B1710; --accent-soft: #1D3828;
    --ok: #7BCB98; --ok-soft: #1B3224; --warn: #E2B44C; --warn-soft: #382D12; --bad: #EF8A7E; --bad-soft: #3B1E1B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1511; --surface: #172019; --surface-2: #202B23; --ink: #E4ECE6; --muted: #98A89E;
  --line: #2C3A30; --accent: #6FC293; --accent-ink: #0B1710; --accent-soft: #1D3828;
  --ok: #7BCB98; --ok-soft: #1B3224; --warn: #E2B44C; --warn-soft: #382D12; --bad: #EF8A7E; --bad-soft: #3B1E1B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--safe-top); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 1.5rem; line-height: 1.2; }
h3 { font-size: 1.1rem; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Cabeçalho e navegação */
.topo { position: sticky; top: var(--safe-top); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topo-in { max-width: 1040px; margin: 0 auto; padding-block: 10px; padding-left: var(--gut-l); padding-right: var(--gut-r); display: flex; align-items: center; gap: 24px; }
.marca { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.marca h1 { font-size: 1.2rem; }
.marca span { color: var(--muted); font-size: .8rem; }
.abas { display: flex; gap: 4px; margin-left: auto; }
.aba { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.aba svg { width: 18px; height: 18px; }
.aba:hover { background: var(--surface-2); color: var(--ink); }
.aba[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
@media (max-width: 760px) {
  .abas { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px var(--gut-r) calc(6px + var(--safe-bottom)) var(--gut-l); justify-content: space-between; z-index: 25; }
  .aba { flex: 1; flex-direction: column; gap: 2px; font-size: .7rem; padding: 6px 2px; }
  .aba svg { width: 22px; height: 22px; }
  main { padding-bottom: calc(84px + var(--safe-bottom)) !important; }
}

main { max-width: 1040px; margin: 0 auto; padding-block: 20px 48px; padding-left: var(--gut-l); padding-right: var(--gut-r); display: grid; gap: 20px; }
.aviso-demo { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: .88rem; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

.cab { display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.cab p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.ferramentas { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Botões e campos */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.perigo { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--accent); }
.btn.mini { padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .6; cursor: wait; }
.icone { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 6px; line-height: 0; }
.icone:hover { background: var(--surface-2); color: var(--bad); }
input[type="text"], input[type="date"], input[type="tel"], input[type="search"], select, textarea {
  width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
textarea { resize: vertical; min-height: 60px; }
label.campo { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 500; }
label.campo > span.dica { font-weight: 400; font-size: .78rem; }
.grade { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.busca { max-width: 260px; }

/* Listas */
.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.bloco-tit { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bloco-tit h3 { font-size: 1rem; }
.linha { display: grid; gap: 4px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; cursor: pointer; }
.linha:last-child { border-bottom: 0; }
.linha:hover { background: var(--surface-2); }
.linha .nome { font-weight: 600; }
.linha .valor { text-align: right; font-variant-numeric: tabular-nums; }
.l-ing { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) minmax(0, 1fr); }
.l-ped { grid-template-columns: minmax(0, 1fr) auto; }
@media (max-width: 640px) {
  .l-ped { grid-template-columns: minmax(0, 1fr); }
  .l-ped .valor { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .l-ped .valor .ferramentas { margin-top: 0 !important; }
}
.l-cli { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) auto; }
@media (max-width: 640px) {
  .l-ing, .l-cli { grid-template-columns: minmax(0, 1fr) auto; }
  .l-ing .meio, .l-cli .meio { grid-column: 1 / -1; grid-row: 2; }
}
.vazio { padding: 24px 16px; color: var(--muted); text-align: center; }
.inativo { opacity: .55; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* Cartões de marmita */
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--accent); }
.card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.card-top h3 { font-size: 1.05rem; }
.comp { margin: 0; padding: 0; list-style: none; font-size: .85rem; color: var(--muted); display: grid; gap: 2px; }
.comp li { display: flex; justify-content: space-between; gap: 8px; }
.contas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.conta small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
.conta b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.barra { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.barra.ok > i { background: var(--ok); } .barra.warn > i { background: var(--warn); } .barra.bad > i { background: var(--bad); }

/* Números de resumo */
.resumos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.resumo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.resumo small { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.resumo b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
.resumo span { font-size: .82rem; color: var(--muted); }

/* DRE */
.dre { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.dre td { padding: 9px 16px; border-bottom: 1px solid var(--line); }
.dre td:last-child { text-align: right; white-space: nowrap; }
.dre tr.sub td { color: var(--muted); padding-left: 32px; font-size: .92rem; }
.dre tr.total td { font-weight: 700; background: var(--surface-2); }
.dre tr.final td { font-weight: 700; font-family: var(--font-display); font-size: 1.15rem; background: var(--accent-soft); border-bottom: 0; }
.dre input { max-width: 120px; text-align: right; padding: 4px 8px; }
.dre .desc-in { max-width: none; text-align: left; }
.dre-custo { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.duas { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 820px) { .duas { grid-template-columns: minmax(0, 1fr); } }
.rank { display: grid; gap: 10px; padding: 14px 16px; }
.rank-l { display: grid; gap: 4px; }
.rank-l div:first-child { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
.tabela-rolagem { overflow-x: auto; }
.hist { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; min-width: 520px; }
.hist th, .hist td { padding: 8px 16px; border-bottom: 1px solid var(--line); text-align: right; }
.hist th:first-child, .hist td:first-child { text-align: left; }
.hist th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
.pos { color: var(--ok); } .neg { color: var(--bad); }

/* Janela de edição */
.fundo { position: fixed; inset: 0; background: rgba(10, 16, 12, .45); z-index: 40; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding: calc(24px + var(--safe-top)) var(--gut-r) calc(24px + var(--safe-bottom)) var(--gut-l); }
.janela { background: var(--surface); border-radius: 14px; width: 100%; max-width: 720px; box-shadow: var(--shadow); display: grid; }
.j-cab { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.j-corpo { padding: 20px; display: grid; gap: 18px; }
.j-rodape { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; position: sticky; bottom: 0; background: var(--surface); border-radius: 0 0 14px 14px; }
.j-rodape .esq { margin-right: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (max-width: 560px) { .fundo { padding: var(--safe-top) 0 0; align-items: flex-end; } .janela { border-radius: 14px 14px 0 0; } .j-rodape { padding-bottom: calc(14px + var(--safe-bottom)); border-radius: 0; } }
.calc { background: var(--surface-2); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.calc .lin { display: flex; justify-content: space-between; gap: 12px; }
.calc .lin b { white-space: nowrap; }
.calc .destaque { font-size: 1.1rem; font-weight: 700; }
.secao-tit { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.secao-tit h4 { margin: 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.itens { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 2fr) 90px auto 76px 34px; gap: 8px; align-items: center; }
.item .un { color: var(--muted); font-size: .85rem; min-width: 24px; }
.item .lc { text-align: right; font-variant-numeric: tabular-nums; font-size: .9rem; }
.item-rec { grid-template-columns: minmax(0, 2fr) 90px auto minmax(0, 1fr) 76px 34px; }
@media (max-width: 560px) {
  .item { grid-template-columns: minmax(0, 1fr) 80px auto 34px; }
  .item .lc { grid-column: 1 / -2; text-align: left; color: var(--muted); }
  .item-rec { grid-template-columns: minmax(0, 1fr) 80px auto 34px; }
  .item-rec .estado { grid-column: 1 / -1; }
}
.pedido-item { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.pi-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.pi-ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.passo { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.passo button { border: 0; background: var(--surface-2); width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; }
.passo input { width: 48px; border: 0; border-radius: 0; text-align: center; padding: 6px 0; }
.preco-in { display: flex; align-items: center; gap: 6px; }
.preco-in input { width: 90px; }
.ajuste { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.ajuste .comp-l { display: grid; grid-template-columns: minmax(0, 1fr) 80px auto; gap: 8px; align-items: center; font-size: .9rem; }
.whats-txt { white-space: pre-wrap; background: var(--surface-2); padding: 14px; border-radius: var(--r); font-size: .9rem; margin: 0; user-select: all; }
details.teste { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 14px; }
details.teste summary { cursor: pointer; font-weight: 600; color: var(--accent); }
details.teste .grade { margin-top: 12px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + var(--safe-bottom)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; z-index: 60; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
@media (max-width: 760px) { .toast { bottom: calc(92px + var(--safe-bottom)); } }
.toast.erro { background: var(--bad); color: #fff; }

/* Lista de compras */
.periodo { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; padding: 14px 16px; }
.periodo label.campo { width: 160px; }
.prod { display: grid; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--line); }
.prod-l { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; }
.prod-l .small { white-space: nowrap; }
.l-compra { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 150px) minmax(0, 160px); gap: 6px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.l-compra:last-child { border-bottom: 0; }
.l-compra.feito .nome-c { text-decoration: line-through; color: var(--muted); }
.l-compra .check input { width: 22px; height: 22px; }
.l-compra .estoque { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); }
.l-compra .estoque input { width: 80px; padding: 5px 8px; }
.l-compra .comprar { text-align: right; font-variant-numeric: tabular-nums; }
.l-compra .comprar b { display: block; font-size: 1.02rem; }
@media (max-width: 640px) {
  .l-compra { grid-template-columns: auto minmax(0, 1fr) auto; }
  .l-compra .estoque { grid-column: 2 / -1; grid-row: 2; }
}
.total-compra { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; background: var(--accent-soft); font-weight: 700; font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.carregando { padding: 60px 0; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .janela.abre { animation: sobe .18s ease-out; } @keyframes sobe { from { transform: translateY(12px); opacity: .6; } } }
</style>

<header class="topo">
  <div class="topo-in">
    <div class="marca"><h1>Marmitas</h1><span>custos e vendas</span></div>
    <nav class="abas" id="abas" aria-label="Telas"></nav>
  </div>
</header>
<main id="conteudo"><div class="carregando">Carregando os dados…</div></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';

/* ============================================================
   Conexão com a planilha (ou modo demonstração, sem planilha)
   ============================================================ */
const MODO_DEMO = !(window.google && google.script && google.script.run);
const CHAVE_DEMO = 'marmitas-demo-v1';
let memoriaDemo = null;

const demo = {
  ler() {
    if (memoriaDemo) return memoriaDemo;
    try { const t = localStorage.getItem(CHAVE_DEMO); if (t) memoriaDemo = JSON.parse(t); } catch (e) { /* sem armazenamento */ }
    if (!memoriaDemo) memoriaDemo = { Ingredientes: [], Receitas: [], Marmitas: [], Clientes: [], Pedidos: [], CustosFixos: [] };
    return memoriaDemo;
  },
  gravar() { try { localStorage.setItem(CHAVE_DEMO, JSON.stringify(memoriaDemo)); } catch (e) { /* sem armazenamento */ } },
  carregarTudo() { return JSON.parse(JSON.stringify(this.ler())); },
  salvar(tabela, reg) {
    const d = this.ler(); reg = JSON.parse(JSON.stringify(reg)); reg.atualizadoEm = new Date().toISOString();
    const i = d[tabela].findIndex(r => r.id === reg.id);
    if (i >= 0) d[tabela][i] = reg; else d[tabela].push(reg);
    this.gravar(); return reg;
  },
  excluir(tabela, id) { const d = this.ler(); d[tabela] = d[tabela].filter(r => r.id !== id); this.gravar(); return id; },
  popularInicial(dados) {
    const d = this.ler();
    if (Object.values(d).some(l => l.length)) return false;
    Object.keys(dados).forEach(k => { d[k] = JSON.parse(JSON.stringify(dados[k])); });
    this.gravar(); return true;
  },
  recomecar() { memoriaDemo = null; try { localStorage.removeItem(CHAVE_DEMO); } catch (e) { /* sem armazenamento */ } }
};

function chamar(fn, ...args) {
  if (MODO_DEMO) {
    try { return Promise.resolve(demo[fn](...args)); } catch (e) { return Promise.reject(e); }
  }
  return new Promise((ok, erro) => { google.script.run.withSuccessHandler(ok).withFailureHandler(erro)[fn](...args); });
}

/* ============================================================
   Dados iniciais (gravados só quando a planilha está vazia)
   ============================================================ */
function dadosIniciais() {
  const ing = (id, nome, categoria, unidade, qtdPacote, preco, perdaLimpeza, fatorCoccao) =>
    ({ id, nome, categoria, unidade, qtdPacote, preco, perdaLimpeza, fatorCoccao, ativo: true });
  return {
    Ingredientes: [
      ing('ing-frango', 'Peito de frango', 'ingrediente', 'kg', 1, 19.90, 6.5, 0.72),
      ing('ing-arroz', 'Arroz branco', 'ingrediente', 'kg', 1, 6.50, 0, 2.5),

/* ============================================================
   Utilidades
   ============================================================ */
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const R = n => brl.format(Number.isFinite(n) && Math.abs(n) >= 0.005 ? n : 0);
const pct = n => (Number.isFinite(n) ? n * 100 : 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + '%';
const fmtN = (n, d = 1) => (Number.isFinite(n) ? n : 0).toLocaleString('pt-BR', { maximumFractionDigits: d });
const fmtIn = n => (n === '' || n === null || n === undefined) ? '' : String(Math.round(Number(n) * 10000) / 10000).replace('.', ',');
function num(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
  let s = String(v ?? '').trim().replace(/^R\$\s*/, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
function hoje() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function mesAtual() { return hoje().slice(0, 7); }
function mesDeslocado(m, delta) { const [a, b] = m.split('-').map(Number); const d = new Date(a, b - 1 + delta, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function nomeMes(m) { const [a, b] = m.split('-').map(Number); const t = new Date(a, b - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); }
function dataBR(d) { if (!d) return ''; const [a, m, dia] = d.split('-'); return dia + '/' + m + '/' + a; }
const norm = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const copia = o => JSON.parse(JSON.stringify(o));

function toast(msg, erro) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (erro ? ' erro' : ''); t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, erro ? 6000 : 2600);
}
function lembrar(chave, valor) { try { localStorage.setItem('marmitas-pref-' + chave, valor); } catch (e) { /* ok */ } }
function lembrado(chave, padrao) { try { return localStorage.getItem('marmitas-pref-' + chave) || padrao; } catch (e) { return padrao; } }

/* ============================================================
   Cálculo de custos
   ============================================================ */
const UNIDADES = {
  kg: { base: 'g', fator: 1000, nome: 'kg' }, g: { base: 'g', fator: 1, nome: 'g' },
  L: { base: 'ml', fator: 1000, nome: 'litro' }, ml: { base: 'ml', fator: 1, nome: 'ml' },
  un: { base: 'un', fator: 1, nome: 'unidade' }
};
const CATEGORIAS = { ingrediente: 'Ingredientes', embalagem: 'Embalagens', tempero: 'Temperos e outros' };
const PAGAMENTOS = ['Pix', 'Dinheiro', 'Cartão de débito', 'Cartão de crédito', 'Fiado / a prazo'];
const CUSTOS_SUGERIDOS = ['Gás', 'Energia elétrica', 'Água', 'Mão de obra', 'Entrega / combustível', 'Impostos (MEI)', 'Internet e telefone', 'Aluguel'];
const META_MARGEM = 0.40;

let db = null;
const ingPorId = id => db.Ingredientes.find(i => i.id === id);
const recPorId = id => db.Receitas.find(r => r.id === id);
const marPorId = id => db.Marmitas.find(m => m.id === id);
const cliPorId = id => db.Clientes.find(c => c.id === id);
const un = i => (UNIDADES[i.unidade] || UNIDADES.un);
const baseUn = i => un(i).base;

function rendimentoIng(i) { const r = (1 - num(i.perdaLimpeza) / 100) * (num(i.fatorCoccao) || 1); return r > 0 ? r : 1; }
function custoCruBase(i) { const q = num(i.qtdPacote) * un(i).fator; return q > 0 ? num(i.preco) / q : 0; }
function custoProntoBase(i) { return custoCruBase(i) / rendimentoIng(i); }
function custoItemReceita(it) { const i = ingPorId(it.id); return i ? num(it.qtd) * (it.estado === 'cru' ? custoCruBase(i) : custoProntoBase(i)) : 0; }
function custoReceita(r) { return (r.itens || []).reduce((s, it) => s + custoItemReceita(it), 0); }
function custoRecPorG(r) { const rend = num(r.rendimento); return rend > 0 ? custoReceita(r) / rend : 0; }
function custoComponente(c) {
  if (c.tipo === 'rec') { const r = recPorId(c.id); return r ? num(c.qtd) * custoRecPorG(r) : 0; }
  const i = ingPorId(c.id); return i ? num(c.qtd) * custoProntoBase(i) : 0;
}
const custoItens = itens => (itens || []).reduce((s, c) => s + custoComponente(c), 0);
function nomeComp(c) { const o = c.tipo === 'rec' ? recPorId(c.id) : ingPorId(c.id); return o ? o.nome : (c.nome || 'item removido'); }
function unComp(c) { if (c.tipo === 'rec') return 'g'; const i = ingPorId(c.id); return i ? baseUn(i) : ''; }
const margem = (preco, custo) => preco > 0 ? (preco - custo) / preco : 0;
const nivel = m => m >= META_MARGEM ? 'ok' : m >= 0.25 ? 'warn' : 'bad';
const ROTULO_NIVEL = { ok: 'Margem boa', warn: 'Margem apertada', bad: 'Margem baixa' };
const precoParaMargem = (custo, m) => m < 1 ? custo / (1 - m) : 0;
/** Mostra um custo por g/ml/un como custo por kg/L/unidade. */
function porUnidadeGrande(valorBase, base) {
  if (base === 'g') return R(valorBase * 1000) + '/kg';
  if (base === 'ml') return R(valorBase * 1000) + '/L';
  return R(valorBase) + '/un';
}
function pesoComida(itens) { return (itens || []).reduce((s, c) => s + (unComp(c) === 'un' ? 0 : num(c.qtd)), 0); }
function usosDoIngrediente(id) {
  return [
    ...db.Receitas.filter(r => (r.itens || []).some(it => it.id === id)).map(r => 'Receita: ' + r.nome),
    ...db.Marmitas.filter(m => (m.itens || []).some(c => c.tipo === 'ing' && c.id === id)).map(m => 'Marmita: ' + m.nome)
  ];
}

   ============================================================ */
function telaIngredientes() {
  const busca = norm(filtro.ingBusca);
  const lista = db.Ingredientes.filter(i => (filtro.inativos || i.ativo) && (!busca || norm(i.nome).includes(busca)))
    .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const blocos = Object.entries(CATEGORIAS).map(([cat, titulo]) => {
    const itens = lista.filter(i => (i.categoria || 'ingrediente') === cat);
    const linhas = itens.map(i => {
      const base = un(i).base, rend = rendimentoIng(i);
      const temRend = Math.abs(rend - 1) > 0.001;
      const qtdTxt = fmtN(num(i.qtdPacote), 3) + ' ' + (i.unidade === 'un' ? (num(i.qtdPacote) === 1 ? 'unidade' : 'unidades') : i.unidade);
      const grande = base === 'g' ? 'kg' : 'L';
      const rendTxt = temRend
        ? (rend > 1 ? `1 ${grande} rende ${fmtN(rend, 2)} ${grande} pronto` : `1 ${grande} vira ${fmtN(rend * 1000, 0)} ${base} pronto`)
        : (base === 'un' ? 'Usado por unidade' : 'Sem perda');
      return `<div class="linha l-ing ${i.ativo ? '' : 'inativo'}" data-acao="editar-ing" data-id="${esc(i.id)}">
        <div><div class="nome">${esc(i.nome)}${i.ativo ? '' : ' <span class="chip">desativado</span>'}</div><div class="small muted num">${R(num(i.preco))} por ${qtdTxt}</div></div>
        <div class="meio small muted">${rendTxt}</div>
        <div class="valor"><b>${porUnidadeGrande(custoProntoBase(i), base)}</b><div class="small muted">${base === 'un' ? 'custo' : 'custo pronto'}</div></div>
      </div>`;
    }).join('');
    return `<section class="bloco"><div class="bloco-tit"><h3>${titulo}</h3><span class="small muted">${itens.length} ${itens.length === 1 ? 'item' : 'itens'}</span></div>${linhas || '<div class="vazio">Nada cadastrado aqui ainda.</div>'}</section>`;
  }).join('');
  return `<div class="cab"><div><h2>Ingredientes</h2><p>Tudo o que ela compra, com o preço pago e quanto rende depois de limpo e cozido. Quando um preço muda, todas as receitas e marmitas se atualizam.</p></div>
    <div class="ferramentas"><input type="search" class="busca" id="f-ing" data-filtro="ingBusca" placeholder="Buscar ingrediente" value="${esc(filtro.ingBusca)}">
    <label class="check small"><input type="checkbox" id="f-inativos" data-filtro="inativos" ${filtro.inativos ? 'checked' : ''}> Mostrar desativados</label>
    <button class="btn pri" data-acao="novo-ing">+ Novo ingrediente</button></div></div>${blocos}`;
}

function dataISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function semana(desloc) {
  const d = new Date(); d.setHours(12, 0, 0, 0);
  const seg = new Date(d); seg.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 7 * desloc);
  const dom = new Date(seg); dom.setDate(seg.getDate() + 6);
  return [dataISO(seg), dataISO(dom)];
}
function estadoCompras() {
  let c = null;
  try { c = JSON.parse(localStorage.getItem('marmitas-compras') || 'null'); } catch (e) { /* ok */ }
  const [de, ate] = semana(0);
  return Object.assign({ de, ate, soAEntregar: true, extras: {}, estoque: {}, marcados: {}, seguranca: 0 }, c || {});
}
let compra = estadoCompras();
function guardarCompras() { try { localStorage.setItem('marmitas-compras', JSON.stringify(compra)); } catch (e) { /* ok */ } }

/** Quanto de cada marmita vai ser produzido: pedidos do período + marmitas a mais. */
function producaoPlanejada() {
  const peds = db.Pedidos.filter(p => p.data >= compra.de && p.data <= compra.ate && (!compra.soAEntregar || !p.entregue));
  const lotes = [], resumo = {}, avisos = [];
  const somar = (chave, nome, deP, extra) => { if (!resumo[chave]) resumo[chave] = { nome, pedidos: 0, extra: 0 }; resumo[chave].pedidos += deP; resumo[chave].extra += extra; };
  peds.forEach(p => (p.itens || []).forEach(it => {
    const q = num(it.qtd); if (!q) return;
    if (it.personalizada) { lotes.push({ itens: it.componentes, qtd: q }); somar(it.marmitaId + '*', it.nome + ' (personalizada)', q, 0); return; }
    const m = marPorId(it.marmitaId);
    if (!m) { avisos.push(it.nome); return; }
    lotes.push({ itens: m.itens, qtd: q }); somar(m.id, m.nome, q, 0);
  }));
  Object.entries(compra.extras).forEach(([id, q]) => { const m = marPorId(id); q = num(q); if (m && q > 0) { lotes.push({ itens: m.itens, qtd: q }); somar(m.id, m.nome, 0, q); } });
  return { peds, lotes, resumo, avisos };
}

/** Converte a produção em ingredientes crus (em g, ml ou unidade). */
function necessidadeCrua(lotes) {
  const nec = {};
  const add = (i, qtdBase) => { if (!i || qtdBase <= 0) return; nec[i.id] = (nec[i.id] || 0) + qtdBase; };
  const crua = (i, qtdPronta) => baseUn(i) === 'un' ? qtdPronta : qtdPronta / rendimentoIng(i);
  lotes.forEach(l => (l.itens || []).forEach(c => {
    const q = num(c.qtd) * l.qtd;
    if (c.tipo === 'rec') {
      const r = recPorId(c.id); if (!r || num(r.rendimento) <= 0) return;
      const f = q / num(r.rendimento);
      (r.itens || []).forEach(it => { const i = ingPorId(it.id); if (!i) return; const qi = num(it.qtd) * f; add(i, it.estado === 'cru' ? qi : crua(i, qi)); });
    } else { const i = ingPorId(c.id); if (i) add(i, crua(i, q)); }
  }));
  return nec;
}
const ehEstimativa = i => i.categoria === 'tempero' && i.unidade === 'un';
function qtdLegivel(qBase, i) {
  const b = baseUn(i);
  if (b === 'un') return fmtN(Math.ceil(qBase - 1e-9), 0) + ' un';
  const grande = b === 'g' ? 'kg' : 'L';
  return qBase >= 1000 ? fmtN(qBase / 1000, 2) + ' ' + grande : fmtN(Math.ceil(qBase - 1e-9), 0) + ' ' + b;
}
function pacoteLegivel(n, i) {
  if (i.unidade === 'un') return num(i.qtdPacote) === 1 ? `${n} ${n === 1 ? 'unidade' : 'unidades'}` : `${n} ${n === 1 ? 'pacote' : 'pacotes'} com ${fmtN(num(i.qtdPacote), 0)} un`;
  return `${n} × ${fmtN(num(i.qtdPacote), 3)} ${i.unidade}`;
}
function listaDeCompras() {
  const prod = producaoPlanejada();
  const nec = necessidadeCrua(prod.lotes);
  const seg = 1 + num(compra.seguranca) / 100;
  const ordemCat = { ingrediente: 0, embalagem: 1, tempero: 2 };
  const itens = Object.entries(nec).map(([id, q]) => ({ i: ingPorId(id), q })).filter(x => x.i && !ehEstimativa(x.i))
    .sort((a, b) => (ordemCat[a.i.categoria] ?? 3) - (ordemCat[b.i.categoria] ?? 3) || a.i.nome.localeCompare(b.i.nome, 'pt-BR'))
    .map(({ i, q }) => {
      const pacote = num(i.qtdPacote) * un(i).fator;
      const precisa = baseUn(i) === 'un' ? Math.ceil(q * seg - 1e-9) : q * seg;
      const tenho = num(compra.estoque[i.id]) * un(i).fator;
      const falta = Math.max(0, precisa - tenho);
      const pacotes = pacote > 0 ? Math.ceil(falta / pacote - 1e-9) : 0;
      return { i, precisa, tenho, falta, pacotes, custo: pacotes * num(i.preco), sobra: pacotes * pacote - falta };
    });
  const estimativas = Object.entries(nec).map(([id, q]) => ({ i: ingPorId(id), q })).filter(x => x.i && ehEstimativa(x.i));
  return { prod, itens, estimativas, total: itens.reduce((s, x) => s + x.custo, 0) };
}

function textoCompras(l) {
  const linhas = [`*Lista de compras: ${dataBR(compra.de)} a ${dataBR(compra.ate)}*`, ''];
  l.itens.filter(x => x.pacotes > 0).forEach(x => linhas.push(`- ${x.i.nome}: ${pacoteLegivel(x.pacotes, x.i)} (${R(x.custo)})`));
  linhas.push('', `*Total estimado: ${R(l.total)}*`);
  return linhas.join('\n');
}

/* ============================================================

   ============================================================ */
function contasDoMes(m) {
  const peds = db.Pedidos.filter(p => (p.data || '').startsWith(m));
  const vendas = peds.reduce((s, p) => s + num(p.subtotal), 0);
  const desc = peds.reduce((s, p) => s + num(p.desconto), 0);
  const entrega = peds.reduce((s, p) => s + num(p.taxaEntrega), 0);
  const receita = vendas - desc + entrega;
  const cmv = peds.reduce((s, p) => s + num(p.custoTotal), 0);
  const bruto = receita - cmv;
  const fixos = db.CustosFixos.filter(c => c.mes === m).reduce((s, c) => s + num(c.valor), 0);
  return { peds, vendas, desc, entrega, receita, cmv, bruto, fixos, liquido: bruto - fixos };
}

function telaDre() {
  const m = filtro.dreMes, c = contasDoMes(m);
  const custos = db.CustosFixos.filter(x => x.mes === m).sort((a, b) => (a.atualizadoEm || '').localeCompare(b.atualizadoEm || ''));
  const jaTem = new Set(custos.map(x => norm(x.descricao)));
  const sugeridos = CUSTOS_SUGERIDOS.filter(s => !jaTem.has(norm(s)));
  const anteriores = db.CustosFixos.filter(x => x.mes === mesDeslocado(m, -1));
  const linhasCustos = custos.map(x => `<tr class="sub"><td><input type="text" class="desc-in" id="cf-d-${esc(x.id)}" data-custo-id="${esc(x.id)}" data-custo-campo="descricao" value="${esc(x.descricao)}" aria-label="Descrição do custo"></td>
    <td><div class="dre-custo"><input type="text" inputmode="decimal" id="cf-v-${esc(x.id)}" data-custo-id="${esc(x.id)}" data-custo-campo="valor" value="${fmtIn(num(x.valor))}" aria-label="Valor de ${esc(x.descricao)}"><button class="icone" data-acao="rm-custo" data-id="${esc(x.id)}" title="Remover" aria-label="Remover ${esc(x.descricao)}">✕</button></div></td></tr>`).join('');
  const mgB = c.receita > 0 ? c.bruto / c.receita : 0, mgL = c.receita > 0 ? c.liquido / c.receita : 0;

  // Ranking de sabores
  const sab = {};

  const ranking = Object.entries(sab).sort((a, b) => b[1].qtd - a[1].qtd);
  const maxQ = ranking.length ? ranking[0][1].qtd : 1;
  const rankHtml = ranking.map(([nome, s]) => { const mg = s.fat > 0 ? s.lucro / s.fat : 0; return `<div class="rank-l"><div><span><b>${esc(nome)}</b></span><span class="num">${fmtN(s.qtd, 0)} un · ${R(s.fat)}</span></div>
    <div class="barra ${nivel(mg)}"><i style="width:${(s.qtd / maxQ) * 100}%"></i></div><div class="small muted">Lucro de ${R(s.lucro)} (${pct(mg)})</div></div>`; }).join('');

  // Melhores clientes

    .map(([n, s]) => `<div class="rank-l"><div><span>${esc(n)}</span><span class="num">${s.n} ${s.n === 1 ? 'pedido' : 'pedidos'} · <b>${R(s.total)}</b></span></div></div>`).join('');

  const histHtml = hist.map(h => `<tr><td>${nomeMes(h.mm)}</td><td>${R(h.receita)}</td><td>${R(h.cmv)}</td><td>${R(h.fixos)}</td><td class="${h.liquido >= 0 ? 'pos' : 'neg'}"><b>${R(h.liquido)}</b></td></tr>`).join('');

  return `<div class="cab"><div><h2>Resultado do mês</h2><p>O que entrou, o que saiu e o que sobrou. O custo das marmitas vem de cada pedido; os custos fixos você lança aqui, mês a mês.</p></div><div class="ferramentas">${seletorMes('f-dmes', 'dreMes')}</div></div>

      <div class="resumo"><small>Lucro bruto</small><b>${R(c.bruto)}</b><span>${pct(mgB)} da receita</span></div>
      <div class="resumo"><small>Lucro líquido</small><b class="${c.liquido >= 0 ? '' : 'neg'}">${R(c.liquido)}</b><span>${c.fixos > 0 ? pct(mgL) + ' da receita' : 'custos fixos ainda não lançados'}</span></div>

let modalTipo = null;

function abrirModal(tipo, dados) { modalTipo = tipo; rascunho = dados; desenharModal(true); const f = document.querySelector('#modal input, #modal select'); if (f && window.innerWidth > 560) f.focus(); }
function fecharModal() { modalTipo = null; rascunho = null; document.getElementById('modal').innerHTML = ''; }
function desenharModal(animar) {
  const M = MODAIS[modalTipo];
  document.getElementById('modal').innerHTML = `<div class="fundo"><div class="janela${animar ? ' abre' : ''}" role="dialog" aria-modal="true" aria-labelledby="m-tit">

  atualizarModal();
}
function atualizarModal() { const M = MODAIS[modalTipo]; if (M && M.atualizar) M.atualizar(); }
function rodapePadrao(extraEsq) {
  return `<div class="esq">${extraEsq || ''}</div><button class="btn" data-acao="fechar">Cancelar</button><button class="btn pri" data-acao="salvar-modal" ${salvando ? 'disabled' : ''}>${salvando ? 'Salvando…' : 'Salvar'}</button>`;
}
function botaoAtivo(rotulo) {
  if (!rascunho._existe) return '';

}
function definir(caminho, valor) {
  const partes = caminho.split('.'); let o = rascunho;
  for (let i = 0; i < partes.length - 1; i++) o = o[partes[i]];
  o[partes[partes.length - 1]] = valor;
}
function campoNum(caminho, valor, attrs) { return `<input type="text" inputmode="decimal" id="m-${caminho.replace(/\./g, '-')}" data-campo="${caminho}" value="${esc(fmtIn(valor))}" ${attrs || ''}>`; }
function setTexto(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }

async function gravar(tabela, reg) {
  const salvo = await chamar('salvar', tabela, reg);
  const lista = db[tabela], i = lista.findIndex(r => r.id === salvo.id);
  if (i >= 0) lista[i] = salvo; else lista.push(salvo);
  return salvo;
}
async function apagar(tabela, id) { await chamar('excluir', tabela, id); db[tabela] = db[tabela].filter(r => r.id !== id); }
function falhou(e) { console.error(e); toast('Não foi possível salvar. Confira a internet e tente de novo.', true); }

async function salvarModal() {
  if (salvando) return;
  const M = MODAIS[modalTipo];
  const erro = M.validar ? M.validar() : '';
  if (erro) { toast(erro, true); return; }
  salvando = true; desenharRodape();
  try { const msg = await M.salvar(); salvando = false; fecharModal(); desenhar(); toast(msg || 'Salvo'); }
  catch (e) { salvando = false; desenharRodape(); falhou(e); }
}
function desenharRodape() { const r = document.querySelector('.j-rodape'); if (r && modalTipo) r.innerHTML = MODAIS[modalTipo].rodape ? MODAIS[modalTipo].rodape() : rodapePadrao(); }

/* ---------- Pedido ---------- */
function clientePorNome(nome) { const n = norm(nome); return n ? db.Clientes.find(c => norm(c.nome) === n) : null; }
function custoUnitItemPedido(it) {
  if (!it._recalc) return num(it.custo);
  if (it.personalizada) return custoItens(it.componentes.map(compDoRascunho));
  const m = marPorId(it.marmitaId); return m ? custoItens(m.itens) : num(it.custo);
}
function totaisPedido(r) {
  const subtotal = r.itens.reduce((s, it) => s + num(it.qtd) * num(it.preco), 0);
  const custo = r.itens.reduce((s, it) => s + num(it.qtd) * custoUnitItemPedido(it), 0);
  const total = subtotal - num(r.desconto) + num(r.taxaEntrega);
  return { subtotal, custo, total };
}
function precoSugeridoPersonalizada(it) {
  const m = marPorId(it.marmitaId); if (!m) return 0;
  const mgBase = margem(num(m.preco), custoItens(m.itens));
  return precoParaMargem(custoUnitItemPedido(it), Math.min(Math.max(mgBase, 0), 0.95));
}

        <div class="pi-ctl"><div class="passo"><button data-acao="passo" data-k="${k}" data-d="-1" aria-label="Menos">−</button><input type="text" inputmode="numeric" id="m-itens-${k}-qtd" data-campo="itens.${k}.qtd" value="${esc(fmtIn(it.qtd))}" aria-label="Quantidade"><button data-acao="passo" data-k="${k}" data-d="1" aria-label="Mais">+</button></div>

        ${it.personalizada ? '' : `<div><button class="btn link" data-acao="ajustar" data-k="${k}">Ajustar quantidades para este cliente</button></div>`}${ajuste}</div>`;
    }).join('');
    return `<datalist id="lista-clientes">${db.Clientes.map(c => `<option value="${esc(c.nome)}"></option>`).join('')}</datalist>
      <div class="grade">
        <label class="campo" style="grid-column:span 2">Cliente<input type="text" id="m-cliente" data-campo="clienteNome" list="lista-clientes" value="${esc(r.clienteNome)}" placeholder="Nome do cliente" autocomplete="off"><span class="dica" id="m-cli-info"></span></label>
        <label class="campo">Data<input type="date" id="m-data" data-campo="data" value="${esc(r.data)}"></label>
      </div>
      <div class="grade" id="m-novo-cli" hidden>
        <label class="campo">Telefone (WhatsApp)<input type="tel" id="m-tel" data-campo="_tel" value="${esc(r._tel)}" placeholder="11 99999-9999"></label>
        <label class="campo" style="grid-column:span 2">Endereço<input type="text" id="m-end" data-campo="_end" value="${esc(r._end)}"></label>
      </div>
      <div class="secao-tit"><h4>Marmitas</h4></div>
      <div class="itens">${itens || '<div class="muted small">Nenhuma marmita no pedido ainda.</div>'}</div>
      <select id="m-add" data-acao-mudar="add-marmita" aria-label="Adicionar marmita"><option value="">+ Adicionar marmita ao pedido…</option>${marmitas.map(m => `<option value="${esc(m.id)}">${esc(m.nome)} · ${R(num(m.preco))}</option>`).join('')}</select>
      <div class="grade">
        <label class="campo">Desconto (R$)${campoNum('desconto', r.desconto)}</label>
        <label class="campo">Taxa de entrega (R$)${campoNum('taxaEntrega', r.taxaEntrega)}</label>
        <label class="campo">Pagamento<select id="m-pag" data-campo="pagamento">${PAGAMENTOS.map(p => `<option ${r.pagamento === p ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
      </div>
      <div class="ferramentas"><label class="check"><input type="checkbox" id="m-pago" data-campo="pago" ${r.pago ? 'checked' : ''}> Já foi pago</label><label class="check"><input type="checkbox" id="m-entregue" data-campo="entregue" ${r.entregue ? 'checked' : ''}> Já foi entregue</label></div>
      <label class="campo">Observações<textarea id="m-obs" data-campo="obs" placeholder="Ex.: entregar sexta à tarde">${esc(r.obs)}</textarea></label>
      <div class="calc" id="m-resumo"></div>`;
  },
  atualizar() {
    const r = rascunho;
    const cli = clientePorNome(r.clienteNome);
    const novo = document.getElementById('m-novo-cli');
    if (novo) novo.hidden = !(String(r.clienteNome || '').trim() && !cli);
    setTexto('m-cli-info', cli ? `Cliente cadastrado${cli.telefone ? ' · ' + esc(cli.telefone) : ''}${cli.obs ? ' · ' + esc(cli.obs) : ''}` : (String(r.clienteNome || '').trim() ? 'Cliente novo: será cadastrado ao salvar.' : ''));
    r.itens.forEach((it, k) => {
      const cu = custoUnitItemPedido(it);
      setTexto('lt-' + k, R(num(it.qtd) * num(it.preco)));
      setTexto('cu-' + k, `Custo ${R(cu)} cada · lucro ${R(num(it.preco) - cu)} (${pct(margem(num(it.preco), cu))})`);
      if (it.personalizada) setTexto('sug-' + k, `Preço sugerido, com a mesma margem do cardápio: <b>${R(precoSugeridoPersonalizada(it))}</b> <button class="btn link" data-acao="usar-sugerido" data-k="${k}">Usar</button>`);
    });
    const t = totaisPedido(r);
    setTexto('m-resumo', `<div class="lin"><span>Subtotal</span><b>${R(t.subtotal)}</b></div>
      ${num(r.desconto) ? `<div class="lin"><span>Desconto</span><b>− ${R(num(r.desconto))}</b></div>` : ''}
      ${num(r.taxaEntrega) ? `<div class="lin"><span>Entrega</span><b>${R(num(r.taxaEntrega))}</b></div>` : ''}
      <div class="lin destaque"><span>Total do pedido</span><b>${R(t.total)}</b></div>
      <div class="lin small muted"><span>Custo das marmitas · lucro estimado</span><span>${R(t.custo)} · ${R(t.total - t.custo - num(r.taxaEntrega))}</span></div>`);
  },
  rodape() {
    const r = rascunho;
    if (!r._existe) return rodapePadrao();
    const esq = r._confirmar
      ? `<span class="small">Excluir este pedido?</span><button class="btn perigo" data-acao="excluir-ped">Sim, excluir</button><button class="btn" data-acao="cancelar-exclusao">Não</button>`
      : `<button class="btn perigo" data-acao="pedir-exclusao">Excluir</button><button class="btn" data-acao="whats" data-id="${esc(r.id)}">WhatsApp</button>`;
    return rodapePadrao(esq);
  },
  validar() {
    const r = rascunho;
    if (!String(r.clienteNome || '').trim()) return 'Informe o nome do cliente.';
    if (!r.data) return 'Informe a data do pedido.';
    if (!r.itens.some(it => num(it.qtd) > 0)) return 'Adicione pelo menos uma marmita.';
    return '';
  },
  async salvar() {
    const r = rascunho;
    let cli = clientePorNome(r.clienteNome);
    if (!cli) cli = await gravar('Clientes', { id: uid('cli'), nome: r.clienteNome.trim(), telefone: (r._tel || '').trim(), endereco: (r._end || '').trim(), obs: '', ativo: true });
    const itens = r.itens.filter(it => num(it.qtd) > 0).map(it => ({
      marmitaId: it.marmitaId, nome: it.nome, tamanho: num(it.tamanho), qtd: num(it.qtd), preco: num(it.preco),
      custo: Math.round(custoUnitItemPedido(it) * 10000) / 10000, personalizada: !!it.personalizada,
      componentes: it.personalizada ? it.componentes.map(c => { const cc = compDoRascunho(c); return { ...cc, nome: nomeComp(cc) }; }) : []
    }));
    const t = totaisPedido({ ...r, itens: itens.map(i => ({ ...i, _recalc: false })) });
    await gravar('Pedidos', { id: r.id, data: r.data, clienteId: cli.id, clienteNome: cli.nome, itens, subtotal: t.subtotal,
      desconto: num(r.desconto), taxaEntrega: num(r.taxaEntrega), total: t.total, custoTotal: t.custo,
      pagamento: r.pagamento, pago: !!r.pago, entregue: !!r.entregue, obs: r.obs || '' });
    filtro.vendasMes = r.data.slice(0, 7);
    return 'Pedido salvo';
  }
};

/* ---------- Mensagem de WhatsApp ---------- */
function textoWhats(p) {
  const l = [`*Pedido de ${dataBR(p.data)}*`, `Cliente: ${p.clienteNome}`, ''];
  (p.itens || []).forEach(it => l.push(`${it.qtd}× ${it.nome}${it.tamanho ? ' (' + fmtN(it.tamanho, 0) + ' g)' : ''}${it.personalizada ? ' – personalizada' : ''}: ${R(it.qtd * it.preco)}`));
  l.push('');
  if (num(p.desconto) || num(p.taxaEntrega)) l.push(`Subtotal: ${R(num(p.subtotal))}`);
  if (num(p.desconto)) l.push(`Desconto: −${R(num(p.desconto))}`);
  if (num(p.taxaEntrega)) l.push(`Entrega: ${R(num(p.taxaEntrega))}`);
  l.push(`*Total: ${R(num(p.total))}*`, `Pagamento: ${p.pagamento}${p.pago ? ' (pago)' : ' (a pagar)'}`);
  if (p.obs) l.push('', `Obs.: ${p.obs}`);
  return l.join('\n');
}

const novoIng = () => ({ id: uid('ing'), nome: '', categoria: 'ingrediente', unidade: 'kg', qtdPacote: 1, preco: '', perdaLimpeza: 0, fatorCoccao: 1, ativo: true, _teste: {} });

const ACOES = {
  aba(d) { aba = d.id; lembrar('aba', aba); desenhar(); window.scrollTo(0, 0); },
  vista(d) { filtro.vendasVista = d.id; desenhar(); },
  fechar() { fecharModal(); },
  'salvar-modal'() { salvarModal(); },
  'novo-ing'() { abrirModal('ing', novoIng()); },
  'editar-ing'(d) { abrirModal('ing', { ...copia(ingPorId(d.id)), _existe: true, _teste: {} }); },
  'nova-rec'() { abrirModal('rec', { id: uid('rec'), nome: '', rendimento: '', itens: [{ id: '', qtd: '', estado: 'pronto' }], ativo: true }); },
  'editar-rec'(d) { abrirModal('rec', { ...copia(recPorId(d.id)), _existe: true }); },
  'nova-mar'() {
    const emb = db.Ingredientes.find(i => i.ativo && i.categoria === 'embalagem'), tmp = db.Ingredientes.find(i => i.ativo && i.categoria === 'tempero');
    const itens = [{ ref: '', qtd: '' }]; if (tmp) itens.push({ ref: 'ing:' + tmp.id, qtd: 1 }); if (emb) itens.push({ ref: 'ing:' + emb.id, qtd: 1 });
    abrirModal('mar', { id: uid('mar'), nome: '', tamanho: 300, preco: '', itens, ativo: true, _meta: 40 });
  },
  'editar-mar'(d) { const m = copia(marPorId(d.id)); abrirModal('mar', { ...m, itens: m.itens.map(c => ({ ref: c.tipo + ':' + c.id, qtd: c.qtd })), _existe: true, _meta: 40 }); },
  'novo-ped'() { abrirModal('ped', { id: uid('ped'), data: hoje(), clienteNome: '', itens: [], desconto: 0, taxaEntrega: 0, pagamento: 'Pix', pago: false, entregue: false, obs: '', _tel: '', _end: '' }); },
  'editar-ped'(d) { const p = copia(db.Pedidos.find(x => x.id === d.id)); p.itens.forEach(it => { it._recalc = false; it.componentes = (it.componentes || []).map(c => ({ ref: c.tipo + ':' + c.id, qtd: c.qtd })); }); abrirModal('ped', { ...p, _existe: true, _tel: '', _end: '' }); },
  'novo-cli'() { abrirModal('cli', { id: uid('cli'), nome: '', telefone: '', endereco: '', obs: '', ativo: true }); },
  'editar-cli'(d) { abrirModal('cli', { ...copia(cliPorId(d.id)), _existe: true }); },
  'alternar-ativo'() { rascunho.ativo = !rascunho.ativo; salvarModal(); },
  'add-item'() { if (modalTipo === 'rec') rascunho.itens.push({ id: '', qtd: '', estado: 'pronto' }); else rascunho.itens.push({ ref: '', qtd: '' }); desenharModal(); },
  'rm-item'(d) { rascunho.itens.splice(Number(d.k), 1); desenharModal(); },
  'usar-teste'() {
    const t = rascunho._teste, c = num(t.comprado), l = num(t.limpo), p = num(t.pronto);
    rascunho.perdaLimpeza = Math.round((1 - l / c) * 1000) / 10; rascunho.fatorCoccao = Math.round(p / l * 100) / 100;
    desenharModal(); toast('Valores do teste aplicados. Confira e salve.');
  },
  'usar-soma'() {
    rascunho.rendimento = rascunho.itens.reduce((s, it) => { const i = ingPorId(it.id); return s + (i && baseUn(i) !== 'un' ? num(it.qtd) : 0); }, 0);
    desenharModal();
  },
  'usar-sugestao'() {
    const custo = custoItens(rascunho.itens.filter(c => c.ref).map(compDoRascunho));
    rascunho.preco = Math.ceil(precoParaMargem(custo, num(rascunho._meta) / 100) * 2) / 2; desenharModal();
  },
  passo(d) { const it = rascunho.itens[Number(d.k)]; it.qtd = Math.max(1, num(it.qtd) + Number(d.d)); desenharModal(); },
  ajustar(d) {
    const it = rascunho.itens[Number(d.k)], m = marPorId(it.marmitaId);
    if (!m) { toast('Esta marmita não está mais no cardápio.', true); return; }
    it.personalizada = true; it._recalc = true; it.componentes = m.itens.map(c => ({ ref: c.tipo + ':' + c.id, qtd: c.qtd }));
    desenharModal();
  },
  'desfazer-ajuste'(d) { const it = rascunho.itens[Number(d.k)], m = marPorId(it.marmitaId); it.personalizada = false; it._recalc = true; it.componentes = []; if (m) it.preco = m.preco; desenharModal(); },
  'usar-sugerido'(d) { const it = rascunho.itens[Number(d.k)]; it.preco = Math.ceil(precoSugeridoPersonalizada(it) * 2) / 2; desenharModal(); },
  'pedir-exclusao'() { rascunho._confirmar = true; desenharRodape(); },
  'cancelar-exclusao'() { rascunho._confirmar = false; desenharRodape(); },
  async 'excluir-ped'() {
    try { await apagar('Pedidos', rascunho.id); fecharModal(); desenhar(); toast('Pedido excluído'); } catch (e) { falhou(e); }
  },
  whats(d) { abrirModal('whats', { id: d.id || rascunho.id }); },
  async copiar() {
    try { await navigator.clipboard.writeText(rascunho.texto); toast('Texto copiado'); }
    catch (e) { const el = document.getElementById('m-texto'); const s = window.getSelection(); const rg = document.createRange(); rg.selectNodeContents(el); s.removeAllRanges(); s.addRange(rg); toast('Texto selecionado. Use copiar do seu aparelho.'); }
  },
  async 'alternar-pago'(d) {
    const p = db.Pedidos.find(x => x.id === d.id);
    try { await gravar('Pedidos', { ...p, pago: !p.pago }); desenhar(); toast(p.pago ? 'Marcado como a receber' : 'Marcado como pago'); } catch (e) { falhou(e); }
  },
  async 'add-custo'(d) {
    try { await gravar('CustosFixos', { id: uid('cf'), mes: filtro.dreMes, descricao: d.desc || 'Outro custo', valor: 0 }); desenhar();
      const ult = db.CustosFixos[db.CustosFixos.length - 1]; const el = document.getElementById('cf-v-' + ult.id); if (el) { el.focus(); el.select(); } } catch (e) { falhou(e); }
  },
  async 'rm-custo'(d) { try { await apagar('CustosFixos', d.id); desenhar(); } catch (e) { falhou(e); } },
  async 'copiar-custos'() {
    try { for (const c of db.CustosFixos.filter(x => x.mes === mesDeslocado(filtro.dreMes, -1))) await gravar('CustosFixos', { id: uid('cf'), mes: filtro.dreMes, descricao: c.descricao, valor: num(c.valor) });
      desenhar(); toast('Custos copiados. Ajuste os valores deste mês.'); } catch (e) { falhou(e); }
  },
  'periodo-compras'(d) { compra.de = d.de; compra.ate = d.ate; guardarCompras(); desenhar(); },
  'extra-compras'(d) { compra.extras[d.id] = Math.max(0, num(compra.extras[d.id]) + Number(d.d)); guardarCompras(); desenhar(); },
  'whats-compras'() { abrirModal('whatsCompras', {}); },
  'limpar-marcados'() { compra.marcados = {}; guardarCompras(); desenhar(); },
  'limpar-compras'() { compra.extras = {}; compra.estoque = {}; compra.marcados = {}; compra.seguranca = 0; guardarCompras(); desenhar(); toast('Lista zerada'); },
  async 'recomecar-demo'() { demo.recomecar(); await iniciar(); toast('Demonstração reiniciada'); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-acao]');
  if (!b || b.tagName === 'SELECT') return;
  if (b.closest('.linha') && b !== b.closest('.linha') && b.dataset.acao !== b.closest('.linha').dataset.acao) e.stopPropagation();
  const f = ACOES[b.dataset.acao];
  if (f) { e.preventDefault(); f(b.dataset, b); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalTipo) fecharModal(); });

function definirCompra(caminho, valor) {
  const [a, b] = caminho.split('.');
  if (b !== undefined) compra[a][b] = valor; else compra[a] = valor;
  if (compra.de > compra.ate) compra.ate = compra.de;
  guardarCompras();
}
function lerCampo(el) {
  if (el.type === 'checkbox') return el.checked;
  return el.value;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.campo && rascunho) {
    definir(el.dataset.campo, lerCampo(el));
    if (modalTipo === 'ped' && /^itens\.\d+\.componentes/.test(el.dataset.campo)) rascunho.itens[Number(el.dataset.campo.split('.')[1])]._recalc = true;
    if (!el.dataset.estrutura) atualizarModal();
  } else if (el.dataset.compra && el.type !== 'checkbox' && el.type !== 'date') {
    definirCompra(el.dataset.compra, el.value);
    const pos = el.selectionStart; desenhar();
    const novo = document.getElementById(el.id); if (novo) { novo.focus(); try { novo.setSelectionRange(pos, pos); } catch (x) { /* ok */ } }
  } else if (el.dataset.filtro && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
    filtro[el.dataset.filtro] = el.value;
    const pos = el.selectionStart; desenhar();
    const novo = document.getElementById(el.id); if (novo) { novo.focus(); try { novo.setSelectionRange(pos, pos); } catch (x) { /* ok */ } }
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.acaoMudar === 'add-marmita' && el.value) {
    const m = marPorId(el.value);
    const existente = rascunho.itens.find(it => it.marmitaId === m.id && !it.personalizada);
    if (existente) existente.qtd = num(existente.qtd) + 1;
    else rascunho.itens.push({ marmitaId: m.id, nome: m.nome, tamanho: m.tamanho, qtd: 1, preco: m.preco, custo: custoItens(m.itens), personalizada: false, componentes: [], _recalc: true });
    desenharModal(); return;
  }
  if (el.dataset.campo && rascunho && el.dataset.estrutura) { definir(el.dataset.campo, lerCampo(el)); desenharModal(); return; }
  if (el.dataset.campo && rascunho && (el.type === 'checkbox' || el.tagName === 'SELECT')) { definir(el.dataset.campo, lerCampo(el)); atualizarModal(); return; }
  if (el.dataset.filtro && (el.type === 'checkbox' || el.tagName === 'SELECT')) { filtro[el.dataset.filtro] = el.type === 'checkbox' ? el.checked : el.value; desenhar(); return; }
  if (el.dataset.compra && (el.type === 'checkbox' || el.type === 'date')) {
    if (el.type === 'date' && !el.value) return;
    definirCompra(el.dataset.compra, el.type === 'checkbox' ? el.checked : el.value); desenhar(); return;
  }
  if (el.dataset.custoId) {
    const c = db.CustosFixos.find(x => x.id === el.dataset.custoId); if (!c) return;
    const novo = { ...c, [el.dataset.custoCampo]: el.dataset.custoCampo === 'valor' ? num(el.value) : el.value.trim() };
    try { await gravar('CustosFixos', novo); desenhar(); toast('Custo salvo'); } catch (x) { falhou(x); }
  }
});

/* ============================================================
   Início
   ============================================================ */
async function iniciar() {
  try {
    db = await chamar('carregarTudo');
    if (Object.values(db).every(l => !l.length)) {
      const base = dadosIniciais();
      if (MODO_DEMO) { db = base; Object.assign(base, exemplosDemo()); }
      await chamar('popularInicial', base);
      db = await chamar('carregarTudo');
    }
    desenhar();
  } catch (e) {
    console.error(e);
    document.getElementById('conteudo').innerHTML = `<div class="bloco vazio">Não foi possível carregar os dados da planilha. Confira a internet e recarregue a página.<br><span class="small">${esc(e && e.message || e)}</span></div>`;
  }
}
iniciar();
</script>
